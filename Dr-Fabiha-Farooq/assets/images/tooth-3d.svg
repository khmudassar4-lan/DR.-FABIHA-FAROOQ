<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 560" fill="none" role="img" aria-labelledby="toothTitle toothDesc">
  <title id="toothTitle">Studio-lit 3D tooth illustration</title>
  <desc id="toothDesc">Anatomically inspired molar with enamel highlights and soft studio shadow</desc>
  <defs>
    <linearGradient id="enamelBody" x1="80" y1="40" x2="340" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="28%" stop-color="#FBF6EE"/>
      <stop offset="62%" stop-color="#EFE6D6"/>
      <stop offset="100%" stop-color="#D9CDB8"/>
    </linearGradient>
    <linearGradient id="enamelSide" x1="250" y1="60" x2="390" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F4EDE0"/>
      <stop offset="100%" stop-color="#C9B79A"/>
    </linearGradient>
    <linearGradient id="rootGrad" x1="160" y1="280" x2="280" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F3E6D2"/>
      <stop offset="45%" stop-color="#E4C9A4"/>
      <stop offset="100%" stop-color="#C9A078"/>
    </linearGradient>
    <radialGradient id="glow" cx="46%" cy="28%" r="42%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="42%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warmCore" cx="58%" cy="46%" r="48%">
      <stop offset="0%" stop-color="#C5A46D" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#C5A46D" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-10%" width="160%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="22" dx="6"/>
      <feColorMatrix values="0 0 0 0 0.07  0 0 0 0 0.24  0 0 0 0 0.23  0 0 0 0.28 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="spec" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="6" specularConstant="1.05" specularExponent="28" lighting-color="#ffffff" result="specOut">
        <fePointLight x="-60" y="-40" z="180"/>
      </feSpecularLighting>
      <feComposite in="specOut" in2="SourceAlpha" operator="in" result="specClip"/>
      <feComposite in="SourceGraphic" in2="specClip" operator="arithmetic" k1="0" k2="1" k3="0.85" k4="0"/>
    </filter>
  </defs>

  <ellipse cx="214" cy="508" rx="92" ry="18" fill="#123D3B" opacity="0.16"/>

  <g filter="url(#softShadow)">
    <g filter="url(#spec)">
      <path fill="url(#rootGrad)" d="M168 292c-8 46-18 92-22 132-2 22 8 42 28 46 16 4 28-8 32-28 8-38 10-86 8-128-18-14-34-18-46-22Z"/>
      <path fill="url(#rootGrad)" d="M214 300c2 48 4 96 2 138-1 22 10 40 30 42 18 2 30-12 32-32 6-48 2-98-8-140-18 4-38 2-56-8Z"/>
      <path fill="url(#rootGrad)" d="M258 288c16 8 32 16 42 28 6 42 16 90 22 128 4 20-6 38-24 42-20 4-34-10-38-30-10-44-22-92-28-136-8-8-16-18-22-32Z"/>

      <path fill="url(#enamelBody)" d="M118 168c-8-52 18-104 78-128 52-22 112-10 148 28 34 36 48 88 32 132-8 22-6 40 4 62 8 18 4 40-16 52-28 18-70 28-118 28s-92-12-118-32c-18-14-22-36-14-54 10-22 14-42 8-64-6-18-10-16-4-24Z"/>
      <path fill="url(#enamelSide)" opacity="0.55" d="M268 64c48 22 86 70 92 128 4 36-10 62-8 88 2 22-12 48-40 62-26 14-70 22-108 22 48-8 96-26 118-56 26-34 22-78 8-118-12-34-38-72-62-126Z"/>

      <path fill="#FBF8F2" d="M156 86c18-28 48-44 86-48 8 18 8 40-2 58-22 8-48 10-72 4-8-4-12-8-12-14Z"/>
      <path fill="#F7F1E6" d="M248 78c22-8 48-6 70 8-4 22-18 38-38 46-22-10-38-26-32-54Z"/>
      <path fill="#FFFDF8" d="M196 74c16-6 36-8 54-2 2 16-6 30-22 36-18 2-32-8-32-34Z"/>
      <path fill="#F3EBDD" d="M150 108c-6 16-8 34-2 50 18 6 40 6 58-2-4-18-8-36-10-54-16 0-32 2-46 6Z"/>
      <path fill="#EFE4D2" opacity="0.9" d="M278 118c8 16 10 36 6 54 20 4 40-2 54-14-8-18-18-34-32-48-10 2-18 4-28 8Z"/>
    </g>
    <ellipse cx="168" cy="148" rx="54" ry="38" fill="url(#glow)"/>
    <ellipse cx="230" cy="200" rx="90" ry="70" fill="url(#warmCore)"/>
    <path stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2.2" stroke-linecap="round" d="M142 150c18-28 48-46 92-44"/>
    <path stroke="#C5A46D" stroke-opacity="0.28" stroke-width="1.2" d="M132 214c36 28 86 40 148 28"/>
  </g>
</svg>
